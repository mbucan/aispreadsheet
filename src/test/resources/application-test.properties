main.datasource.url=jdbc:hsqldb:mem:aispreadsheet_test
main.datasource.username=sa
main.datasource.password=

# Isolate the test conf dir from .jmix/conf, where Jmix Studio hot-deploys classes for the
# IDE-run app instance. Hot-deployed classes in a shared conf dir are loaded by Jmix's
# JavaClassLoader and make UI tests fail with cross-classloader ClassCastExceptions.
jmix.core.conf-dir=${user.dir}/build/test-conf
